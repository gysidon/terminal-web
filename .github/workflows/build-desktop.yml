name: Build Desktop

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundle: nsis
          - os: windows-latest
            bundle: msi
          # macOS 用 universal-apple-darwin 通用二进制，一份 dmg 同时支持 Intel 与 Apple Silicon
          - os: macos-latest
            bundle: dmg
            target: universal-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      # 构建 Go 服务端，作为 Tauri sidecar 嵌入安装包。
      # 二进制放到 desktop/src-tauri/binaries/，由 tauri.conf.json 的
      # bundle.resources 复制到应用资源目录，main.rs 从 resource_dir/binaries/ 读取。
      # macOS universal：分别编 arm64 与 amd64，再用 lipo 合并成通用二进制。
      - name: Build Go server sidecar
        shell: bash
        working-directory: server-go
        run: |
          mkdir -p ../desktop/src-tauri/binaries
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            GOOS=windows GOARCH=amd64 CGO_ENABLED=0 \
              go build -trimpath -o ../desktop/src-tauri/binaries/terminal-web-server.exe .
          elif [ "${{ matrix.target }}" = "universal-apple-darwin" ]; then
            GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -o /tmp/tw-server-arm64 .
            GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -o /tmp/tw-server-amd64 .
            lipo -create -output ../desktop/src-tauri/binaries/terminal-web-server \
              /tmp/tw-server-arm64 /tmp/tw-server-amd64
          else
            GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 \
              go build -trimpath -o ../desktop/src-tauri/binaries/terminal-web-server .
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build web frontend
        run: |
          cd web
          npm ci
          npm run build

      # msi 目标依赖 WiX Toolset，Windows runner 默认未安装。
      - name: Install WiX (msi target only)
        if: matrix.bundle == 'msi'
        run: choco install wixtoolset -y

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # universal 构建需要同时具备两个 Rust 编译目标
      - name: Add Rust targets (macOS universal)
        if: matrix.target == 'universal-apple-darwin'
        run: rustup target add x86_64-apple-darwin aarch64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          args: ${{ matrix.target != '' && format('--target {0} --bundles {1}', matrix.target, matrix.bundle) || format('--bundles {0}', matrix.bundle) }}

      # macOS 无 Apple 开发者证书时做 ad-hoc 签名：让二进制在清除 quarantine 后能正常启动。
      # 若以后配置了 Developer ID（$APPLE_SIGN_IDENTITY + $APPLE_API_* 用于 notarize），
      # 把这里的 "-" 换成 "$APPLE_SIGN_IDENTITY" 并补 notarize 步骤即可。
      - name: Ad-hoc code sign (macOS, no cert)
        if: matrix.target == 'universal-apple-darwin'
        run: |
          APP=$(find desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos -maxdepth 1 -name '*.app' | head -1)
          echo "Ad-hoc signing: $APP"
          codesign --force --deep --sign - "$APP"

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: terminal-web-${{ matrix.bundle }}${{ matrix.target != '' && format('-{0}', matrix.target) || '' }}
          # 开了 --target 后 bundle 路径变为 target/<triple>/release/bundle，用 ** 兼容有无 target 两种情况
          path: desktop/src-tauri/target/**/release/bundle/**/*
          if-no-files-found: warn

  # 汇总各平台安装包，创建 GitHub Release。
  # 仅在推送 v* 正式 tag 时创建 Release；其他情况下只构建不发版。
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: terminal-web-*
          merge-multiple: false

      - name: Determine release tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=nightly-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: TerminalWeb ${{ steps.tag.outputs.tag }}
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
