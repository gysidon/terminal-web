name: Build Desktop

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundle: nsis
          - os: windows-latest
            bundle: msi
          # macOS 用 universal-apple-darwin 通用二进制，一份 dmg 同时支持 Intel 与 Apple Silicon
          - os: macos-latest
            bundle: dmg
            target: universal-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      # 构建 Go 服务端，作为 Tauri sidecar 嵌入安装包。
      # 二进制放到 desktop/src-tauri/binaries/，由 tauri.conf.json 的
      # bundle.resources 复制到应用资源目录，main.rs 从 resource_dir/binaries/ 读取。
      # macOS universal：分别编 arm64 与 amd64，再用 lipo 合并成通用二进制。
      - name: Build Go server sidecar
        shell: bash
        working-directory: server-go
        run: |
          mkdir -p ../desktop/src-tauri/binaries
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            GOOS=windows GOARCH=amd64 CGO_ENABLED=0 \
              go build -trimpath -o ../desktop/src-tauri/binaries/terminal-web-server.exe .
          elif [ "${{ matrix.target }}" = "universal-apple-darwin" ]; then
            GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -o /tmp/tw-server-arm64 .
            GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -o /tmp/tw-server-amd64 .
            lipo -create -output ../desktop/src-tauri/binaries/terminal-web-server \
              /tmp/tw-server-arm64 /tmp/tw-server-amd64
          else
            GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 \
              go build -trimpath -o ../desktop/src-tauri/binaries/terminal-web-server .
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build web frontend
        run: |
          cd web
          npm ci
          npm run build

      # msi 目标依赖 WiX Toolset，Windows runner 默认未安装。
      - name: Install WiX (msi target only)
        if: matrix.bundle == 'msi'
        run: choco install wixtoolset -y

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # universal 构建需要同时具备两个 Rust 编译目标
      - name: Add Rust targets (macOS universal)
        if: matrix.target == 'universal-apple-darwin'
        run: rustup target add x86_64-apple-darwin aarch64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      # tauri-action 执行 Tauri 2 构建依赖 @tauri-apps/cli（JS CLI）。
      # desktop 项目此前没有 package.json，CI 也未在此安装，导致 build 静默不产出 bundle。
      - name: Install Tauri CLI (desktop)
        run: |
          cd desktop
          npm install

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_CLI_LOG: debug
        with:
          projectPath: desktop
          args: ${{ matrix.target != '' && format('--target {0} --bundles {1} --verbose', matrix.target, matrix.bundle) || format('--bundles {0} --verbose', matrix.bundle) }}

      # 诊断：build 后打印关键目录与产物，确认是否真正产出 bundle（即使上一步失败也运行）
      - name: Diagnose build output (macOS)
        if: ${{ always() && runner.os == 'macOS' }}
        run: |
          echo "::group::universal release 目录（应有终端二进制）"
          ls -la desktop/src-tauri/target/universal-apple-darwin/release/ 2>/dev/null || echo "(无 universal-apple-darwin/release 目录)"
          echo "::endgroup::"
          echo "::group::universal bundle 目录"
          find desktop/src-tauri/target/universal-apple-darwin/release/bundle -maxdepth 3 2>/dev/null || echo "(无 bundle 目录)"
          echo "::endgroup::"
          echo "::group::全局查找 .app / .dmg / 二进制"
          find desktop/src-tauri/target \( -name '*.app' -o -name '*.dmg' -o -name 'terminal-web-desktop' -o -name 'TerminalWeb' \) 2>/dev/null | head -30
          echo "::endgroup::"
          echo "::group::cargo 原始构建产物（兜底确认二进制是否生成）"
          find desktop/src-tauri/target -name 'terminal-web-desktop' -type f 2>/dev/null | head
          echo "::endgroup::"

      # macOS ad-hoc 签名已在 tauri.conf.json 的 bundle.macOS.signingIdentity: "-" 中配置，
      # Tauri 打包阶段会自动对 .app 做 ad-hoc 签名，dmg 内嵌 app 一并签好。
      # 无需事后单独 codesign（打包后 Tauri 会清理中间 .app，事后签名步骤必然找不到文件而失败）。
      # 若以后配置 Developer ID（$APPLE_SIGN_IDENTITY + $APPLE_API_* 用于 notarize），
      # 将 tauri.conf.json 中的 "-" 改为 "$APPLE_SIGN_IDENTITY" 并补 notarize 步骤即可。

      # create-dmg 会在 bundle/ 下留下大量中间脚手架（bundle_dmg.sh、icon.icns、
      # eula-resources-template.xml、template.applescript、rw.*.dmg 临时镜像、.DS_Store、
      # 以及已嵌入 dmg 内的 TerminalWeb.app）。只把最终安装包挑选出来，避免垃圾文件被传进 Release。
      - name: Stage release artifacts
        shell: bash
        run: |
          mkdir -p dist-release
          # macOS 最终 dmg（排除 create-dmg 临时 rw.*.dmg 读写镜像）
          find desktop/src-tauri/target -path '*/bundle/dmg/*.dmg' ! -name 'rw.*.dmg' -exec cp {} dist-release/ \;
          # Windows nsis / msi 安装包
          find desktop/src-tauri/target -path '*/bundle/*' \( -name '*.msi' -o -name '*.exe' \) -exec cp {} dist-release/ \;
          echo "::group::staged release artifacts"
          ls -la dist-release/
          echo "::endgroup::"

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: terminal-web-${{ matrix.bundle }}${{ matrix.target != '' && format('-{0}', matrix.target) || '' }}
          path: dist-release/*
          if-no-files-found: warn

  # 汇总各平台安装包，创建 GitHub Release。
  # 仅在推送 v* 正式 tag 时创建 Release；其他情况下只构建不发版。
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: terminal-web-*
          merge-multiple: false

      - name: Determine release tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=nightly-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: TerminalWeb ${{ steps.tag.outputs.tag }}
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
