<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Terminal Web</title>
  <style>
    :root {
      --bg: #101014;
      --text: #eeeeee;
      --accent: #63e2b7;
      --border: #26262c;
      --sub: #777777;
      --g1: rgba(34, 211, 238, 0.18);
      --g2: rgba(99, 226, 183, 0.18);
    }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      color: var(--text);
    }
    .splash { display: flex; flex-direction: column; align-items: center; gap: 16px; }
    .logo {
      width: 64px; height: 64px; border-radius: 16px;
      background: linear-gradient(135deg, var(--g1), var(--g2));
      border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      animation: pulse 1.4s ease-in-out infinite;
    }
    .spin {
      width: 22px; height: 22px; border-radius: 50%;
      border: 2px solid var(--border); border-top-color: var(--accent);
      animation: spin 0.8s linear infinite;
    }
    .name { font-size: 16px; font-weight: 600; letter-spacing: 0.5px; }
    .sub { font-size: 12px; color: var(--sub); }
    .logo svg { stroke: var(--accent); }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse { 0%, 100% { opacity: 0.7; } 50% { opacity: 1; } }
  </style>
  <script>
    // 跟随用户在设置里配置的主题（由 Rust 启动端通过 ?theme= 传入）。
    // 在 <head> 首帧绘制前同步执行，因此不会出现错色闪烁。
    (function () {
      try {
        var p = new URLSearchParams(location.search);
        var t = p.get('theme') === 'light' ? 'light' : 'dark';
        var v = t === 'dark'
          ? { bg:'#101014', text:'#eeeeee', accent:'#63e2b7', border:'#26262c', sub:'#777777',
              g1:'rgba(34,211,238,0.18)', g2:'rgba(99,226,183,0.18)' }
          : { bg:'#f5f6f8', text:'#222222', accent:'#0ea5a4', border:'#e2e4e8', sub:'#8a8f98',
              g1:'rgba(34,211,238,0.22)', g2:'rgba(99,226,183,0.22)' };
        var s = document.documentElement.style;
        s.setProperty('--bg', v.bg);
        s.setProperty('--text', v.text);
        s.setProperty('--accent', v.accent);
        s.setProperty('--border', v.border);
        s.setProperty('--sub', v.sub);
        s.setProperty('--g1', v.g1);
        s.setProperty('--g2', v.g2);
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div class="splash">
    <div class="logo">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="4 17 10 11 4 5"></polyline>
        <line x1="12" y1="19" x2="20" y2="19"></line>
      </svg>
    </div>
    <div class="spin"></div>
    <div class="name">Terminal Web</div>
    <div class="sub">正在启动…</div>
  </div>
</body>
</html>
